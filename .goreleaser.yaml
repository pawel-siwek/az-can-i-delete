# Release build for az-can-i-delete.
#
# The binary is static (CGO_ENABLED=0) so the same file runs in Cloud Shell, in
# a distroless container and on a developer's laptop. Linux amd64 is the
# platform that matters first, because that is what Cloud Shell runs.
#
# Every archive is checksummed with SHA-256, and scripts/install.sh verifies
# the checksum before it puts anything on a PATH.
version: 2

project_name: az-can-i-delete

before:
  hooks:
    - go mod download
    # A release that cannot pass its own acceptance suite must not be cut.
    - go test ./...

builds:
  - id: az-can-i-delete
    main: ./cmd/az-can-i-delete
    binary: az-can-i-delete
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      # The version travels into every report, so a verdict can be traced back
      # to the build that produced it.
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # Windows on arm64 has no users for this tool yet.
      - goos: windows
        goarch: arm64
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - REQUIREMENTS.md
      - IMPLEMENTATION-PLAN.md

  # The same binaries again, uncompressed and unwrapped. An archive is the
  # convention and carries the documents with it, but dropping a tool into a
  # shell should not need a tar step: this id makes installing one download
  # and a chmod. Both are checksummed, so the short path is not the unchecked
  # one.
  - id: binary
    formats: [binary]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256
  # The install scripts are checksummed too, so the thing you run to verify the
  # download is itself verifiable. An installer that arrives unverified and then
  # checks the archive has only moved the trust, not established it.
  extra_files:
    - glob: ./scripts/install.sh
    - glob: ./scripts/cloud-shell.sh

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - Merge branch

release:
  draft: false
  prerelease: auto
  # The scripts ship as release assets so they can be fetched by tag and
  # checked against the checksums above, rather than piped from a branch.
  extra_files:
    - glob: ./scripts/install.sh
    - glob: ./scripts/cloud-shell.sh
  footer: |
    ## Installing

    One download and a `chmod` — the bare binaries are published alongside
    the archives:

    ```sh
    gh release download {{ .Tag }} -R pawel-siwek/az-can-i-delete -p az-can-i-delete_linux_amd64 -O ~/.local/bin/az-can-i-delete && chmod +x ~/.local/bin/az-can-i-delete
    ```

    To have the checksum checked too, use the installer, which verifies the
    archive's SHA-256 before anything reaches your PATH:

    ```sh
    d=$(mktemp -d) && gh release download {{ .Tag }} -R pawel-siwek/az-can-i-delete -p install.sh -D "$d" && bash "$d/install.sh" {{ .Tag }}
    ```

    Azure Cloud Shell ships the GitHub CLI; `gh auth login` once and both work
    there, on a private repository, with no token to paste. Every artifact
    here is listed in `checksums.txt`, including the bare binaries.

    A verdict from this tool is evidence, not permission. `yes` means no
    evidence of use was found by the signals it could evaluate, never that
    deleting is safe; every `yes` prints the limitations that go with it.
