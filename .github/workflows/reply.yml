# The reviewer, when somebody asks it something.
#
# `Review` runs on its own when a pull request changes. This runs when a
# person asks: a comment containing `/review` re-reviews the change, and
# `/review <question>` answers the question where it was asked.
#
# Two things about this trigger are worth saying out loud, because they are
# what makes it safe rather than merely convenient.
#
# `issue_comment` always runs with a writable token, unlike `pull_request`,
# which hands a fork nothing. So the reviewer is built from the base branch,
# before any of the pull request's code is on disk: what runs here is what the
# default branch says it is, not whatever the pull request would like it to be.
# The change is then read as a diff, which is material, never something run.
#
# And only people who already have write access can ask. A comment is the
# cheapest thing in the world to write, and this one spends the owner's model.
name: Reply

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: reply-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  answer:
    name: Answer the question
    runs-on: ubuntu-latest
    if: >-
      github.event.comment.user.type != 'Bot' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
      contains(github.event.comment.body, '/review') &&
      (github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request)
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0"

      # From the base branch, before the pull request's code exists here.
      - name: Build the reviewer
        run: dotnet publish tools/Saruman -o "$RUNNER_TEMP/reviewer" -warnaserror --nologo

      # Say it was heard. A question that sits for a minute with no sign of
      # life reads as a question nobody is answering.
      # Saruman's own identity, so a review is signed by Saruman rather than by
      # the workflow that happened to run it. A GitHub App is an identity, not
      # a service: nothing is hosted, and the token it mints lasts an hour.
      #
      # Optional on purpose. Without the app the reviewer still reviews, as
      # `github-actions[bot]`; a missing identity is not a reason to say
      # nothing.
      - name: Speak as Saruman
        id: saruman
        if: vars.SARUMAN_APP_ID != '' && secrets.SARUMAN_PRIVATE_KEY != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.SARUMAN_APP_ID }}
          private-key: ${{ secrets.SARUMAN_PRIVATE_KEY }}

      - name: Acknowledge
        env:
          GH_TOKEN: ${{ steps.saruman.outputs.token || secrets.GITHUB_TOKEN }}
          COMMENT: ${{ github.event.comment.id }}
          KIND: ${{ github.event_name }}
        run: |
          if [ "$KIND" = "pull_request_review_comment" ]; then
            path="pulls/comments/$COMMENT/reactions"
          else
            path="issues/comments/$COMMENT/reactions"
          fi
          gh api -X POST "repos/${{ github.repository }}/$path" -f content=eyes || true

      - name: Read the pull request
        id: pr
        env:
          GH_TOKEN: ${{ steps.saruman.outputs.token || secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          base="$(gh pr view "$NUMBER" --json baseRefName --jq .baseRefName)"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          git fetch --no-tags origin \
            "+refs/heads/$base:refs/remotes/origin/$base" \
            "+refs/pull/$NUMBER/head:refs/pr/head"
          git checkout --quiet --detach refs/pr/head

      - name: Is a model configured
        id: configured
        env:
          ENDPOINT: ${{ vars.AZURE_AI_ENDPOINT }}
          CLIENT: ${{ vars.AZURE_CLIENT_ID }}
        run: |
          if [ -n "$ENDPOINT" ] && [ -n "$CLIENT" ]; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "yes=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Azure AI endpoint is configured, so there is nothing to ask."
          fi

      - uses: azure/login@v2
        if: steps.configured.outputs.yes == 'true'
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # The comment's text reaches the reviewer as an environment variable and
      # never as part of a command. It is somebody else's writing: it is the
      # reviewer's job to read it, and nothing else's job to run it.
      - name: Answer
        if: steps.configured.outputs.yes == 'true'
        env:
          AZURE_AI_ENDPOINT: ${{ vars.AZURE_AI_ENDPOINT }}
          AZURE_AI_DEPLOYMENT: ${{ vars.AZURE_AI_DEPLOYMENT }}
          GITHUB_TOKEN: ${{ steps.saruman.outputs.token || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          REVIEW_COMMENT_ID: ${{ github.event_name == 'pull_request_review_comment' && github.event.comment.id || '' }}
          BODY: ${{ github.event.comment.body }}
          BASE: ${{ steps.pr.outputs.base }}
        run: |
          AZURE_AI_TOKEN="$(az account get-access-token \
            --resource https://cognitiveservices.azure.com \
            --query accessToken -o tsv)"
          export AZURE_AI_TOKEN

          # Everything after `/review` is the question. Nothing after it is a
          # question, so it is a plain re-review and goes back as a review.
          REVIEW_QUESTION="$(printf '%s' "${BODY#*/review}" | sed 's/^[[:space:]]*//')"
          export REVIEW_QUESTION

          dotnet "$RUNNER_TEMP/reviewer/Saruman.dll" "origin/$BASE"
