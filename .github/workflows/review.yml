name: Review

# Every pull request is compared against the documents that govern it before a
# human spends attention on it. This check blocks the merge; Copilot's review
# comments beside it do not, and are not meant to.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  drift:
    name: Drift against the spec and the records
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The comparison needs both sides, so the whole history comes along.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Fetch the base branch
        run: git fetch --no-tags origin "${{ github.event.pull_request.base.ref }}"

      # The records' own constraints, checked against the source rather than
      # against a diff: no clock in the verdict engine, no api-version literal,
      # no key acquisition, and the records themselves well formed and indexed.
      - name: Conformance
        run: go test ./internal/conformance/ ./internal/adr/ ./internal/drift/

      # And the half that only exists between two versions.
      - name: Drift
        run: go run ./cmd/driftcheck "origin/${{ github.event.pull_request.base.ref }}"

  judgement:
    name: Judgement against the spec and the records
    runs-on: ubuntu-latest
    # The model is the repository owner's, reached with a federated token, so
    # there is no key in a secret and nobody is billed per pull request. When
    # the endpoint is not configured the job reports that it did not run.
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0"

      - name: Fetch the base branch
        run: git fetch --no-tags origin "${{ github.event.pull_request.base.ref }}"

      # Built on every pull request, whether or not a model is configured, so a
      # broken reviewer is found here rather than the first time it is needed.
      - name: Build the reviewer
        run: dotnet build tools/Saruman -warnaserror --nologo

      # Saruman's own identity, so a review is signed by Saruman rather than by
      # the workflow that happened to run it. A GitHub App is an identity, not
      # a service: nothing is hosted, and the token it mints lasts an hour.
      #
      # Optional on purpose. Without the app the reviewer still reviews, as
      # `github-actions[bot]`; a missing identity is not a reason to say
      # nothing.
      # Whether the identity can be used at all. A run Dependabot triggers
      # gets no repository secrets, so the key is empty while the app id, a
      # variable, is not; minting a token then crashes the job. The secret can
      # only be tested in a step, never in an `if:` (see internal/conformance).
      - name: Is Saruman's identity available
        id: identity
        env:
          APP_ID: ${{ vars.SARUMAN_APP_ID }}
          KEY: ${{ secrets.SARUMAN_PRIVATE_KEY }}
        run: |
          if [ -n "$APP_ID" ] && [ -n "$KEY" ]; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "yes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Speak as Saruman
        id: saruman
        if: steps.identity.outputs.yes == 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.SARUMAN_APP_ID }}
          private-key: ${{ secrets.SARUMAN_PRIVATE_KEY }}

      - name: Is a model configured
        id: configured
        env:
          ENDPOINT: ${{ vars.AZURE_AI_ENDPOINT }}
          CLIENT: ${{ vars.AZURE_CLIENT_ID }}
          ACTOR: ${{ github.actor }}
        run: |
          # Dependabot's runs get a read-only token and no federated identity,
          # so the model cannot be reached nor a review posted. Saying so is
          # the honest outcome; crashing on the login is not.
          if [ "$ACTOR" = "dependabot[bot]" ]; then
            echo "yes=false" >> "$GITHUB_OUTPUT"
            echo "::notice::A Dependabot run cannot reach the model, so no judgement was made. The drift check still decides; a human reviews the dependency."
          elif [ -n "$ENDPOINT" ] && [ -n "$CLIENT" ]; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "yes=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Azure AI endpoint is configured, so no judgement was made. The drift check still decides this pull request."
          fi

      # Federated credentials: the workflow proves who it is to Entra and gets
      # a short-lived token. No secret is stored anywhere.
      - uses: azure/login@v3
        if: steps.configured.outputs.yes == 'true'
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Review
        if: steps.configured.outputs.yes == 'true'
        env:
          AZURE_AI_ENDPOINT: ${{ vars.AZURE_AI_ENDPOINT }}
          AZURE_AI_DEPLOYMENT: ${{ vars.AZURE_AI_DEPLOYMENT }}
          GITHUB_TOKEN: ${{ steps.saruman.outputs.token || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          AZURE_AI_TOKEN="$(az account get-access-token \
            --resource https://cognitiveservices.azure.com \
            --query accessToken -o tsv)"
          export AZURE_AI_TOKEN
          dotnet run --project tools/Saruman --no-build -- "origin/${{ github.event.pull_request.base.ref }}"
