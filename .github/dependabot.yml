version: 2
updates:
  # Go modules. The SDK versions are pinned deliberately (REQUIREMENTS.md), so
  # an update arrives as a pull request that has to pass the acceptance suite
  # like any other change, never silently.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    # golang.org/x releases now require Go 1.26, and taking one rewrites the
    # module's go directive. REQUIREMENTS section 7 pins Go 1.25, so they wait
    # for that pin to move rather than arriving as a bump that changes it.
    ignore:
      - dependency-name: "golang.org/x/*"
    groups:
      azure-sdk:
        patterns: ["github.com/Azure/*", "github.com/AzureAD/*"]
      golang-x:
        patterns: ["golang.org/x/*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
