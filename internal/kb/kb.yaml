# The storage name knowledge base.
#
# A container, share, queue, table, account, resource group, tag or lock name
# often identifies what produced it. That is a weak signal and it is treated as
# one: a name match alone never rises above the entry's unconfirmedTier, and it
# becomes the confirmed tier only when the producer is found in configuration.
# The confirm field says what would confirm it, in prose, for a human — it is
# not a query this tool runs.
#
# Provenance: the 79 entries of research-3 section G, carried verbatim in
# docs/SPEC.md appendix L section 10.1, with the architect-3 section 3.6
# corrections that docs/SPEC.md section 9.3 selects applied:
#
#   container.insights-logs   regex admits hyphens, so insights-logs-kube-audit
#                             matches, as its own example always claimed
#   accountName.aks           f plus 23 hex digits, not 22
#   container.tfstate         a suffix needs its hyphen, so tfstatefiles-backup
#                             stays a counterexample
#   container.wad             wad- plus a segment, not an alternation ending .*
#   share.functions-content-by-site  becomes a mechanism: the old regex matched
#                             almost any share name
#   the six mechanism entries  regex .* with mechanism true; they are matched by
#                             a confirming query, never by name
#   three blobPrefix entries  the mandated example GUID
#   tag.cloudshell            unconfirmedTier INFO; the value-based Cloud Shell
#                             signal is separate
#   the three LAD entries     confirm records that Reader cannot see it
#   the eight WebJobs entries tier DESIGN_INTENT with the site-analyzer confirm
#
# Order is significant: the first entry matching a (kind, name) wins, so a
# specific entry precedes its generic one. tier is the confirmed tier;
# unconfirmedTier is what a name alone may claim.
schemaVersion: 1
rulesDate: '2026-09-21'
entries:
- id: container.insights-logs
  kind: container
  regex: (?i)^insights-logs-[a-z0-9-]+$
  mechanism: false
  producer: Azure Monitor diagnostic settings (resource logs), one container per log category
  tier: HARD_DEPENDENCY
  unconfirmedTier: DESIGN_INTENT
  confirm: diagnosticSettings.storageAccountId == this account on the source resource (source id is embedded
    in blob path `resourceId=/SUBSCRIPTIONS/...`)
  freshness: walk `resourceId=/…/y=YYYY/m=MM/d=DD/h=HH/m=00/PT1H.json` — time-ordered level 2..5
  confidence: high
  status: VERIFIED
  source_url: https://github.com/MicrosoftDocs/azure-monitor-docs/blob/main/articles/azure-monitor/platform/resource-logs.md
  examples:
  - insights-logs-auditevent
  - insights-logs-storageread
  - insights-logs-operationallogs
  - insights-logs-kube-audit
  counterexamples:
  - insights-logs
  - insights-metrics-pt1m
  - myinsights-logs-x
